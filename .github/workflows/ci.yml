name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check vendored payload
        run: |
          set -e
          test -f libs/amap-3dmap.jar
          test -f src/main/assets/ae/res.zip
          test -f src/main/assets/cfg/a/mode_1/map.sdkrs
          test -f src/main/assets/amap_keys.json
          test -f src/main/jniLibs/arm64-v8a/libAMapSDK_MAP_v7_1_0.so
          unzip -l libs/amap-3dmap.jar | grep -q 'com/amap/api/col/sl3/ip.class'
          unzip -p libs/amap-3dmap.jar com/amap/api/col/sl3/ip.class | grep -aq 'amap_keys.json'

      - name: Build
        run: ./gradlew --no-daemon fatAar

      - name: Check AAR
        run: |
          set -e
          AAR=$(ls build/outputs/fat/*.aar | head -1)
          echo "AAR: $AAR"
          unzip -l "$AAR" | grep -q 'jni/arm64-v8a/libAMapSDK_MAP_v7_1_0.so'
          unzip -l "$AAR" | grep -q 'assets/ae/res.zip'
          unzip -l "$AAR" | grep -q 'assets/amap_keys.json'
          unzip -p "$AAR" classes.jar > /tmp/classes.jar
          unzip -l /tmp/classes.jar | grep -q 'com/amap/api/maps/MapView.class'
          unzip -l /tmp/classes.jar | grep -q 'com/amap/api/services/poisearch/PoiSearch.class'

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: ReadyAMapSDK-aar
          path: build/outputs/fat/*.aar

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ReadyAMapSDK-aar
          path: aar

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: aar/*.aar
          generate_release_notes: true
